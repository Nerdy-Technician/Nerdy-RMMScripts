name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Scripts with existing ShellCheck errors (see PR description). They are
      # reported without failing CI; remove them from this list once fixed.
      KNOWN_ISSUES: |
        Linux/Monitoring/Check - MeshAgent_is_running.sh
        Linux/Monitoring/Check - Remotely_is_running.sh
        Linux/Monitoring/Check - Wazuh_is_running.sh
        Linux/Network/Network - Port Scan.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck (errors only)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bash' \
            | grep -zvxF -f <(printf '%s\n' "$KNOWN_ISSUES" | sed '/^$/d') \
            | xargs -0 -r shellcheck --severity=error
      - name: ShellCheck known issues (report only)
        continue-on-error: true
        run: |
          printf '%s\n' "$KNOWN_ISSUES" | sed '/^$/d' | tr '\n' '\0' \
            | xargs -0 -r shellcheck --severity=error --format=gcc \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::warning file=\1,line=\2,col=\3::\4/'

  powershell:
    name: PowerShell (PSScriptAnalyzer errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $files = git ls-files | Where-Object { $_ -match '\.(ps1|psm1|psd1)$' }
          $failed = 0
          foreach ($file in $files) {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            foreach ($e in $parseErrors) {
              $failed++
              Write-Output "::error file=$file,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            foreach ($r in Invoke-ScriptAnalyzer -Path $file -Severity Error) {
              $failed++
              Write-Output "::error file=$file,line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
            }
          }
          Write-Output "Analyzed $($files.Count) PowerShell files, $failed error(s)."
          if ($failed -gt 0) { exit 1 }

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  # Merges Dependabot PRs once every check above has passed.
  dependabot-automerge:
    name: Auto-merge Dependabot
    needs: [shellcheck, powershell, actionlint, dependency-review, secret-scan]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Squash-merge PR
        run: gh pr merge "$PR_URL" --squash --delete-branch
